publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 图片选择（拍照 / 相册单选 / 相册多选）
  image_picker: ^1.1.2
  # 轻量状态管理
